[service]
database_path = "/var/lib/codex-provider-probe/private/status.sqlite3"
public_database_path = "/var/lib/codex-provider-probe/public/status.sqlite3"
temp_root = "/var/lib/codex-provider-probe/private/tmp"
codex_bin = "/opt/codex-provider-probe/runtime/node_modules/.bin/codex"

[[providers]]
id = "provider-primary"
name = "Provider Primary"
base_url = "https://primary.example.com/v1"
credential_name = "provider_primary_api_key"
probe_mode = "automatic"
models = ["gpt-5.6-sol", "gpt-5.5"]
display_models = ["gpt-5.6-sol", "gpt-5.5"]
healthy_interval_seconds = 600
healthy_interval_max_seconds = 1200
unhealthy_interval_seconds = 120
unhealthy_interval_max_seconds = 300
timeout_seconds = 90

