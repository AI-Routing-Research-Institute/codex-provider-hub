name: Pull Request Policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate branch policy
        run: python scripts/team_policy.py validate-pr --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"

  tests-windows:
    name: tests-windows
    runs-on: windows-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-status.txt
      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install -r requirements-status.txt
      - name: Run Python tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check JavaScript syntax
        shell: pwsh
        run: |
          node --check proxy_static/app.js
          node --check provider_status/static/app.js
      - name: Run JavaScript tests
        shell: pwsh
        run: |
          Get-ChildItem tests -Filter *.test.js | ForEach-Object {
            node --test $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  tests-macos:
    name: tests-macos
    runs-on: macos-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-status.txt
      - name: Install Python dependencies
        shell: bash
        run: python -m pip install -r requirements-status.txt
      - name: Run Python tests
        shell: bash
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          node --check proxy_static/app.js
          node --check provider_status/static/app.js
      - name: Run JavaScript tests
        shell: bash
        run: |
          for test_file in tests/*.test.js; do
            node --test "$test_file"
          done
