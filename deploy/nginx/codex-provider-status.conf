limit_req_zone $binary_remote_addr zone=codex_status_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=codex_manual_probe_per_ip:1m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_IP__;

    location = /codex-status {
        return 308 /codex-status/;
    }

    location ^~ /codex-status/api/manual-probes/ {
        limit_except POST {
            deny all;
        }

        limit_req zone=codex_manual_probe_per_ip burst=2 nodelay;
        client_max_body_size 1k;
        proxy_cache off;
        proxy_pass http://127.0.0.1:__WEB_PORT__/api/manual-probes/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location ^~ /codex-status/ {
        limit_except GET HEAD {
            deny all;
        }

        limit_req zone=codex_status_per_ip burst=20 nodelay;
        proxy_cache off;
        proxy_pass http://127.0.0.1:__WEB_PORT__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
